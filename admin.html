<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Painel Admin — RSX Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080f1e;--surface:#0f1628;--card:#141e35;
  --border:rgba(201,165,116,.15);--border-focus:rgba(201,165,116,.5);
  --gold:#c9a574;--gold-dim:rgba(201,165,116,.6);
  --text:#e8ddd0;--text-dim:rgba(232,221,208,.55);
  --red:#e05555;--green:#4caf7d;--radius:6px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
input,textarea,button{font-family:inherit;font-size:inherit}
a{color:var(--gold);text-decoration:none}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,165,116,.07) 0%,transparent 65%),var(--bg)}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;
  letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:40px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px}
.login-title{font-size:15px;font-weight:500}
.login-note{font-size:12px;color:var(--text-dim);line-height:1.6}
.login-error{color:var(--red);font-size:12px;display:none}
.login-error.show{display:block}
.default-pass-hint{font-size:11px;color:rgba(232,221,208,.3)}

/* ── SHARED FIELD STYLES ── */
.field-group{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:500}
.field-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;color:var(--text);outline:none;transition:border-color .2s;width:100%}
.field-input:focus{border-color:var(--border-focus)}
textarea.field-input{resize:vertical;min-height:90px;line-height:1.6}
.field-help{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:2px}

/* ── BUTTONS ── */
.btn-primary{background:var(--gold);color:#080f1e;border:none;border-radius:var(--radius);
  padding:11px 24px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:opacity .2s,transform .15s;width:100%}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-save{background:var(--gold);color:#080f1e;border:none;border-radius:var(--radius);
  padding:8px 22px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.btn-save:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);
  border-radius:var(--radius);padding:7px 16px;font-size:11px;letter-spacing:.06em;
  cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap}
.btn-ghost:hover{color:var(--text);border-color:var(--border-focus)}
.btn-pick{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 14px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;
  transition:border-color .2s;white-space:nowrap}
.btn-pick:hover{border-color:var(--border-focus)}
.btn-clear{background:transparent;border:none;font-size:11px;color:var(--red);
  cursor:pointer;opacity:.7;padding:0;transition:opacity .2s}
.btn-clear:hover{opacity:1}
input[type="file"]{display:none}

/* ── APP LAYOUT ── */
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}

.app-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.app-brand{display:flex;align-items:center;gap:14px}
.app-brand img{height:34px;width:auto}
.app-brand-label{font-size:11px;font-weight:500;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase}
.app-actions{display:flex;align-items:center;gap:10px}

.app-body{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:20px 0;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.sidebar-section-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-dim);font-weight:500;padding:8px 20px 4px;margin-top:8px}
.sidebar-section-label:first-child{margin-top:0}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 16px;
  border-radius:0;cursor:pointer;font-size:13px;color:var(--text-dim);
  transition:background .15s,color .15s;user-select:none;border:none;
  background:transparent;width:100%;text-align:left}
.nav-btn:hover{background:rgba(201,165,116,.05);color:var(--text)}
.nav-btn.active{background:rgba(201,165,116,.1);color:var(--gold);
  box-shadow:inset 3px 0 0 var(--gold)}
.nav-icon{font-size:14px;flex-shrink:0}

/* ── MAIN CONTENT ── */
.main{flex:1;overflow-y:auto;padding:36px 44px 60px}
.main-inner{max-width:740px}

.page-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:400;
  color:var(--text);margin-bottom:6px}
.page-subtitle{font-size:12px;color:var(--text-dim);margin-bottom:36px;line-height:1.6}

.cms-section{margin-bottom:44px}
.cms-section-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-dim);font-weight:600;margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--border)}

.field-row{margin-bottom:20px}

/* ── IMAGE PICKER ── */
.img-picker{display:flex;flex-direction:column;gap:10px}
.img-preview{width:100%;aspect-ratio:16/9;background:var(--card);
  border:1px dashed var(--border);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-size:cover;background-position:center;position:relative}
.img-preview.square{aspect-ratio:1/1;max-width:180px}
.img-ph{font-size:11px;color:var(--text-dim);text-align:center;line-height:1.7}
.img-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.img-url{flex:1;min-width:180px}

/* ── VIDEO PREVIEW ── */
.vid-preview{width:100%;aspect-ratio:16/9;background:var(--card);border:1px dashed var(--border);
  border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:10px}
.vid-preview iframe{width:100%;height:100%;border:none}
.vid-ph{font-size:11px;color:var(--text-dim);text-align:center;line-height:1.7}

/* ── INFO BOX ── */
.info-box{background:rgba(201,165,116,.05);border:1px solid rgba(201,165,116,.18);
  border-radius:var(--radius);padding:14px 18px;font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:20px}
.info-box strong{color:var(--gold)}
.info-box code{color:var(--gold);background:rgba(201,165,116,.1);padding:1px 5px;border-radius:3px;font-size:11px}

/* ── PASS CHANGE ── */
.pass-row{display:flex;gap:8px;align-items:flex-end}
.pass-row .field-input{flex:1}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;
  padding:10px 22px;border-radius:var(--radius);font-size:13px;font-weight:500;
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;
  pointer-events:none;z-index:9999}
#toast.show{opacity:1;transform:none}
#toast.error{background:var(--red)}

/* ── TAG PICKER ── */
.tag-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tag-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:11px;font-weight:500;color:var(--text-dim);
  cursor:pointer;transition:all .15s;letter-spacing:.04em}
.tag-btn:hover{border-color:var(--border-focus);color:var(--text)}
.tag-btn.selected{background:rgba(201,165,116,.15);border-color:var(--gold);color:var(--gold)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* ── PROPOSTAS LIST ── */
.prop-list-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.prop-list-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.prop-list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.prop-list-row:last-child{border-bottom:none}
.prop-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prop-status-dot.open{background:#4ade80}
.prop-status-dot.exp{background:#f87171}
.prop-list-client{flex:1;min-width:0}
.prop-list-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-list-detail{font-size:10px;color:var(--text-dim)}
.prop-list-date{width:90px;font-size:10px;color:var(--text-dim);flex-shrink:0}
.prop-list-actions{display:flex;gap:6px;flex-shrink:0;width:240px;justify-content:flex-end}
.prop-action-btn{font-size:10px;color:var(--gold-dim);background:rgba(220,192,147,.07);border:1px solid rgba(220,192,147,.15);border-radius:2px;padding:4px 9px;cursor:pointer;white-space:nowrap;transition:.15s}
.prop-action-btn:hover{background:rgba(220,192,147,.14)}
.prop-action-btn.danger{color:rgba(248,113,113,.7);background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.15)}
.prop-list-empty{padding:40px;text-align:center;color:var(--text-dim);font-size:13px}
/* ── WIZARD ── */
.wiz-container{max-width:760px}
.wiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.wiz-steps-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px}
.wiz-step-item{flex:1;padding:10px 8px;text-align:center;font-size:9px;letter-spacing:.06em;color:var(--text-dim);border-right:1px solid var(--border);cursor:pointer;transition:.15s}
.wiz-step-item:last-child{border-right:none}
.wiz-step-item.active{color:var(--gold-dim);background:rgba(220,192,147,.07);font-weight:600}
.wiz-step-item.done{color:rgba(220,192,147,.5)}
.wiz-step-item.done:hover{background:rgba(220,192,147,.05)}
.wiz-body{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin-bottom:16px}
.wiz-body-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:20px}
.wiz-footer{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.wiz-progress{font-size:11px;color:var(--text-dim)}
.wiz-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.wiz-field-grid.three{grid-template-columns:1fr 1fr 1fr}
.wiz-field-grid.full{grid-template-columns:1fr}
.wiz-field{margin-bottom:0}
.resort-toggle-wrap{display:flex;gap:0;background:rgba(255,255,255,.04);border-radius:4px;border:1px solid var(--border);overflow:hidden;width:fit-content;margin-bottom:18px}
.resort-toggle-btn{font-size:11px;padding:8px 20px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:.15s}
.resort-toggle-btn.active{background:rgba(220,192,147,.15);color:var(--gold-dim);font-weight:600}
.svc-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:3px;padding:8px 10px;margin-bottom:6px}
.svc-icon-input{width:36px;font-size:18px;background:transparent;border:none;color:var(--text);text-align:center;cursor:pointer}
.svc-desc-input{flex:1;background:transparent;border:none;color:var(--text);font-size:12px;outline:none;font-family:inherit}
.svc-price-input{width:100px;background:transparent;border:none;color:var(--gold-dim);font-size:12px;text-align:right;outline:none;font-family:inherit}
.svc-remove-btn{background:none;border:none;color:rgba(248,113,113,.5);cursor:pointer;font-size:14px;padding:0 4px}
.svc-add-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.svc-preset-btn{font-size:10px;background:rgba(220,192,147,.07);border:1px solid var(--border);border-radius:3px;padding:5px 10px;color:var(--text-dim);cursor:pointer;transition:.15s}
.svc-preset-btn:hover{background:rgba(220,192,147,.14);color:var(--gold-dim)}
.wiz-total{background:rgba(220,192,147,.07);border:1px solid rgba(220,192,147,.2);border-radius:3px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.wiz-total-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim)}
.wiz-total-val{font-size:20px;color:var(--gold-dim);font-family:'Cormorant Garamond',serif}
.children-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.children-age-input{width:70px !important;flex-shrink:0}
/* ── ACCOMMODATION OPTIONS ── */
.accom-opt-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:5px;padding:16px;margin-bottom:10px}
.accom-opt-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.accom-opt-label{flex:1;font-weight:600;font-size:12px}
.link-result{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);border-radius:4px;padding:16px;margin-bottom:16px}
.link-result-url{font-size:11px;color:#4ade80;word-break:break-all;margin-bottom:10px;font-family:monospace}

/* ── MOBILE ── */
.mob-menu-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
@media(max-width:680px){
  .mob-menu-btn{display:block}
  .app-brand-label{display:none}
  .sidebar{position:fixed;top:0;left:-260px;height:100%;width:240px;z-index:100;padding-top:56px;transition:left .25s ease;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .sidebar.mob-open{left:0}
  .mob-overlay.mob-open{display:block}
  .main{padding:16px 14px 48px}
  .page-title{font-size:26px}
  .page-subtitle{margin-bottom:24px}
  .wiz-container{max-width:100%}
  .wiz-body{padding:16px 14px}
  .wiz-header{margin-bottom:14px}
  .wiz-header .page-title{font-size:20px;margin-bottom:0}
  .wiz-steps-bar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .wiz-step-item{min-width:46px;padding:9px 4px;font-size:8px;letter-spacing:0}
  .wiz-field-grid,.wiz-field-grid.three{grid-template-columns:1fr}
  .wiz-footer{gap:8px;flex-wrap:wrap}
  .wiz-progress{width:100%;text-align:center;order:-1}
  .resort-toggle-wrap{width:100%}
  .resort-toggle-btn{flex:1;text-align:center}
  .svc-row{flex-wrap:wrap}
  .svc-price-input{width:100%}
  .prop-list-date{display:none}
  .prop-list-actions{width:auto;flex-wrap:wrap;gap:4px}
  .prop-list-row{flex-wrap:wrap}
  .prop-list-client{width:100%;min-width:100%;order:-1}
  .link-copy-btn,.link-result a{font-size:10px;padding:6px 10px}
}
.link-copy-btn{background:#4ade80;color:#000;border:none;padding:7px 16px;border-radius:2px;font-size:10px;letter-spacing:.12em;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- ════════════ LOGIN ════════════ -->
<div id="login">
  <div class="login-logo">RSX · Travel</div>
  <div class="login-card">
    <div class="login-title">Painel de Administração</div>
    <div class="login-note">Acesso restrito. Digite a senha para gerenciar o conteúdo do site.</div>
    <div class="field-group">
      <label class="field-label">Senha</label>
      <input type="password" id="passInput" class="field-input" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div id="loginError" class="login-error">Senha incorreta. Tente novamente.</div>
  </div>
  <div class="default-pass-hint">Senha padrão: rsx2024</div>
</div>

<!-- ════════════ APP ════════════ -->
<div id="app">
  <header class="app-header">
    <div class="app-brand">
      <button class="mob-menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <img src="design_handoff_rsx_travel_site/assets/rsx-logo-principal-crop.png" alt="RSX Travel"/>
      <span class="app-brand-label">Painel de Conteúdo</span>
    </div>
    <div class="app-actions">
      <button id="previewLink" class="btn-ghost" data-href="index.html" onclick="window._previewWin=window.open(this.dataset.href,'rsx_preview')">Ver Home ↗</button>
      <button class="btn-save" onclick="CMS.save(); setTimeout(()=>{ try{ if(window._previewWin && !window._previewWin.closed) window._previewWin.location.reload(); }catch(e){} }, 400)">💾 Salvar</button>
      <button class="btn-ghost" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="mob-overlay" id="mobOverlay" onclick="toggleSidebar()"></div>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section-label">Configurações</div>
      <button class="nav-btn active" data-page="geral" onclick="showPage('geral',this)">
        <span class="nav-icon">⚙️</span>Geral
      </button>

      <div class="sidebar-section-label">Páginas</div>
      <button class="nav-btn" data-page="index" onclick="showPage('index',this)">
        <span class="nav-icon">🏠</span>Início
      </button>
      <button class="nav-btn" data-page="costao" onclick="showPage('costao',this)">
        <span class="nav-icon">🏖️</span>Costão do Santinho
      </button>
      <button class="nav-btn" data-page="fazzenda" onclick="showPage('fazzenda',this)">
        <span class="nav-icon">🌿</span>Fazzenda Park
      </button>
      <button class="nav-btn" data-page="japaratinga" onclick="showPage('japaratinga',this)">
        <span class="nav-icon">🏝️</span>Japaratinga
      </button>
      <button class="nav-btn" data-page="sobre" onclick="showPage('sobre',this)">
        <span class="nav-icon">👤</span>Sobre / Quem sou
      </button>
      <button class="nav-btn" data-page="contato" onclick="showPage('contato',this)">
        <span class="nav-icon">✉️</span>Contato
      </button>

      <div class="sidebar-section-label">Ferramentas</div>
      <button class="nav-btn" data-page="propostas" onclick="showPage('propostas',this)">
        <span class="nav-icon">📋</span>Propostas
      </button>

      <div class="sidebar-section-label">Criar</div>
      <button class="nav-btn" data-page="novo" onclick="showPage('novo',this)">
        <span class="nav-icon">➕</span>Novo Destino
      </button>
      <div id="custom-pages-nav"></div>
    </aside>

    <main class="main" id="mainContent">
      <div class="main-inner" id="mainInner"></div>
    </main>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════
   CMS ENGINE
══════════════════════════════════════════ */
const CMS = {
  KEY: 'rsx_cms_content',
  PASS_KEY: 'rsx_admin_pass',
  AUTH_KEY: 'rsx_admin_session',
  DEFAULT: 'rsx2024',
  data: {},

  load() {
    try { this.data = JSON.parse(localStorage.getItem(this.KEY) || '{}'); }
    catch(e) { this.data = {}; }
    if (!this.data.global) this.data.global = {};
    if (!this.data.pages)  this.data.pages  = {};
  },

  // Busca dados do servidor e mescla (server tem prioridade — URL /midia/ sobrescreve base64 local)
  syncFromServer(callback) {
    fetch('cms-data.json?_=' + Date.now())
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(serverData) {
        if (!serverData || (!serverData.pages && !serverData.global)) {
          if (callback) callback(false);
          return;
        }
        // Mescla: server tem prioridade campo a campo
        if (serverData.global) {
          Object.assign(CMS.data.global, serverData.global);
        }
        if (serverData.pages) {
          Object.keys(serverData.pages).forEach(function(pg) {
            if (!CMS.data.pages[pg]) CMS.data.pages[pg] = {};
            Object.assign(CMS.data.pages[pg], serverData.pages[pg]);
          });
        }
        // Sincroniza localStorage com dados mesclados
        try { localStorage.setItem(CMS.KEY, JSON.stringify(CMS.data)); } catch(e) {}
        if (callback) callback(true);
      })
      .catch(function() { if (callback) callback(false); });
  },

  save(silent) {
    // Migração: remove chaves depreciadas de todas as páginas
    if (this.data.pages) {
      Object.keys(this.data.pages).forEach(function(pg) {
        if (!CMS.data.pages[pg]) return;
        // meta_coordenadas foi renomeado para meta_regiao — apagar do servidor
        delete CMS.data.pages[pg].meta_coordenadas;
      });
    }
    // 1. Salva no localStorage (rápido, local)
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch(e) {
      toast('❌ Armazenamento cheio. Use URLs externas para imagens grandes.', true);
      throw e;
    }
    // 2. Envia para o servidor (cms-data.json) para todos verem
    var payload = Object.assign({}, this.data, { _pass: this.pass() });
    fetch('cms-save.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.ok) {
        if (!silent) toast('✅ Salvo! Mudanças visíveis para todos.');
      } else {
        toast('⚠️ Salvo local, mas falhou no servidor: ' + res.error, true);
      }
    })
    .catch(function() {
      if (!silent) toast('⚠️ Salvo local. Servidor indisponível.', true);
    });
  },

  get(page, key) {
    if (page === 'global') return this.data.global[key] || '';
    return (this.data.pages[page] || {})[key] || '';
  },

  set(page, key, val) {
    if (page === 'global') {
      this.data.global[key] = val;
    } else {
      if (!this.data.pages[page]) this.data.pages[page] = {};
      this.data.pages[page][key] = val;
    }
  },

  pass()       { return localStorage.getItem(this.PASS_KEY) || this.DEFAULT; },
  checkPass(p) { return p === this.pass(); },
  setPass(p)   { localStorage.setItem(this.PASS_KEY, p); }
};

const PROPOSALS = {

let toastTimer;
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}

   HELPERS
══════════════════════════════════════════ */
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
function ytId(url) {
  const m = (url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&\s?\/]+)/);
  return m ? m[1] : null;
}

function fImg({ pg, key, label, help, square }) {
  const val = CMS.get(pg, key);

  const ph    = val ? '' : `<div class="img-ph">📷<br/>Sem imagem</div>`;
  return `<div class="field-row">

    ${help ? `<div class="field-help">${help}</div>` : ''}

          oninput="onUrlInput('${pg}','${key}','prev_${id}',this.value)"/>

      </div>

function fTags({ pg, key, label, help, options, single }) {
  const val  = CMS.get(pg, key) || '';
  const sel  = val.split(',').map(s => s.trim()).filter(Boolean);
  const mode = single ? 'single' : 'multi';
  return `<div class="field-row">
    <label class="field-label">${label}</label>
    ${help ? `<div class="field-help">${help}</div>` : ''}
    <div class="tag-picker">
      ${options.map(opt => `<button type="button"
        class="tag-btn${sel.includes(opt) ? ' selected' : ''}"
        onclick="toggleTag('${pg}','${key}','${opt}',this,'${mode}')">
        ${opt}
      </button>`).join('')}
    </div>
  </div>`;
}

function toggleTag(pg, key, val, btn, mode) {
  if (mode === 'single') {
    // deselect all others in same group
    btn.closest('.tag-picker').querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    CMS.set(pg, key, val);
  } else {
    const current = (CMS.get(pg, key)||'').split(',').map(s=>s.trim()).filter(Boolean);
    const idx = current.indexOf(val);
    if (idx >= 0) current.splice(idx, 1); else current.push(val);
    CMS.set(pg, key, current.join(', '));
    btn.classList.toggle('selected');
  }
  CMS.save(true); // salva automaticamente ao clicar numa tag (silencioso)
}

/* ══════════════════════════════════════════
   IMAGE / VIDEO EVENT HANDLERS
══════════════════════════════════════════ */
function onFilePick(pg, key, prevId, input) {
  const file = input.files[0];
  if (!file) return;

  const localUrl = URL.createObjectURL(file);
  setImgPreview(prevId, localUrl);
  toast('⏳ Enviando foto para o servidor…');

  const pass = CMS.pass();
  const form = new FormData();
  form.append('file', file);
  form.append('_pass', pass);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'upload.php');

  xhr.onload = function() {
    URL.revokeObjectURL(localUrl);
    input.value = '';
    try {
      const data = JSON.parse(xhr.responseText);
      if (!data.ok) throw new Error(data.error || 'Erro no servidor');
      CMS.set(pg, key, data.url);
      setImgPreview(prevId, data.url);
      CMS.save(true);
      toast('✅ Foto salva em ' + data.url);
    } catch(e) {
      toast('❌ Upload falhou: ' + e.message + ' | Resposta: ' + xhr.responseText.slice(0,100), true);
      setImgPreview(prevId, CMS.get(pg, key) || '');
    }
  };

  xhr.onerror = function() {
    URL.revokeObjectURL(localUrl);
    input.value = '';
    toast('❌ Erro de conexão ao enviar foto.', true);
    setImgPreview(prevId, CMS.get(pg, key) || '');
  };

  xhr.send(form);
}
function onUrlInput(pg, key, prevId, val) {
  CMS.set(pg, key, val.trim());
  if (val.trim()) { setImgPreview(prevId, val.trim()); CMS.save(true); }
}
function clearImg(pg, key, prevId) {
  CMS.set(pg, key, '');
  const el = document.getElementById(prevId);
  if (el) { el.style.backgroundImage=''; el.innerHTML='<div class="img-ph">📷<br/>Sem imagem</div>'; }
}
function setImgPreview(prevId, url) {
  const el = document.getElementById(prevId);
  if (!el) return;
  el.style.backgroundImage = `url('${url}')`;
  el.style.backgroundSize  = 'cover';
  el.style.backgroundPosition = 'center';
  el.innerHTML = '';
}
function onVideoInput(pg, key, prevId, val) {
  CMS.set(pg, key, val);
  const vid = ytId(val);
  const el  = document.getElementById(prevId);
  if (!el) return;
  el.innerHTML = vid
    ? `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?mute=1" allow="autoplay" title="Preview"></iframe>`
    : `<div class="vid-ph">🎬<br/>Cole a URL para ver o preview</div>`;
}

function onVideoFilePick(pg, key, input) {
  const file = input.files[0];
  if (!file) return;
  const id   = `vup_${pg}_${key}`;
  const prog = document.getElementById('vprog_' + id);
  const bar  = document.getElementById('vbar_'  + id);
  const pct  = document.getElementById('vpct_'  + id);
  if (prog) prog.style.display = 'block';

  const pass = CMS.pass();
  const form = new FormData();
  form.append('file', file);
  form.append('_pass', pass);
  // Passa nome fixo para salvar na pasta Videos/ com nome correto
  const fixedName = VIDEO_FILENAMES[pg];
  if (fixedName) form.append('filename', fixedName);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'upload.php');

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable && bar && pct) {
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%';
      pct.textContent = p + '% — ' + (e.loaded / 1024 / 1024).toFixed(1) + 'MB de ' + (e.total / 1024 / 1024).toFixed(1) + 'MB';
    }
  };

  xhr.onload = function() {
    if (prog) prog.style.display = 'none';
    try {
      const data = JSON.parse(xhr.responseText);
      if (!data.ok) throw new Error(data.error);
      CMS.set(pg, key, data.url);
      CMS.save(true);
      toast('✅ Vídeo enviado: ' + data.url);
      // Atualiza o status na UI
      const wrap = input.closest('.img-actions') || input.parentElement;
      if (wrap) {
        const old = wrap.querySelector('span');
        if (old) old.textContent = '✅ ' + data.url;
        else wrap.insertAdjacentHTML('beforeend', `<span style="color:#8fb88f;font-size:12px">✅ ${data.url}</span>`);
      }
    } catch(e) {
      toast('❌ Erro no upload: ' + e.message, true);
    }
    input.value = '';
  };

  xhr.onerror = function() {
    if (prog) prog.style.display = 'none';
    toast('❌ Falha na conexão ao enviar vídeo.', true);
    input.value = '';
  };

  xhr.send(form);
}

/* Fetch a page, extract current texts, pre-fill CMS if fields are empty */
async function prefillFromPage(pageId, file) {
  if (!file) return;
  try {
    const res  = await fetch(file + '?_=' + Date.now());
    if (!res.ok) return;
    const txt  = await res.text();
    const doc  = new DOMParser().parseFromString(txt, 'text/html');
    const map  = PAGE_FIELD_MAPS[pageId];
    if (!map) return;
    let filled = 0;
    map.forEach(f => {
      if (CMS.get(pageId, f.k)) return; // already set, don't overwrite
      const el = doc.querySelector(f.s);
      if (!el) return;
      const val = f.t === 'html' ? el.innerHTML.trim() : '';
      if (val) { CMS.set(pageId, f.k, val); filled++; }
    });
    if (filled > 0) {
      // Refresh the rendered form so fields show the fetched values
      const inner = document.getElementById('mainInner');
      inner.innerHTML = PAGES[pageId] ? PAGES[pageId]() : inner.innerHTML;
      toast(`${filled} campo(s) preenchidos com o texto atual da página.`);
    }
  } catch(e) { /* silently ignore fetch errors (e.g. file:// protocol) */ }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mob-open');
  document.getElementById('mobOverlay').classList.toggle('mob-open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('mobOverlay').classList.remove('mob-open');
}

function showPage(id, btn) {
  closeSidebar();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const pl = document.getElementById('previewLink');
  if (pl) pl.dataset.href = PAGE_LINKS[id] || 'index.html';
  const inner = document.getElementById('mainInner');
  try {
    inner.innerHTML = PAGES[id] ? PAGES[id]() : '<p>Não encontrado</p>';
  } catch(err) {
    inner.innerHTML = `<div style="color:#f87171;padding:24px;background:rgba(255,0,0,.1);border-radius:8px;font-family:monospace;font-size:13px"><strong>Erro ao carregar seção:</strong><br/>${err.message}</div>`;
    console.error('showPage error:', err);
  }
  document.querySelector('.main').scrollTop = 0;
  // Auto-fill fields from the live page if they're empty
  const file = PAGE_LINKS[id];
  if (file && PAGE_FIELD_MAPS[id]) prefillFromPage(id, file);
}

/* ── Proposal list actions ── */
function propCopyLink(id, link) {
  navigator.clipboard.writeText(link).then(() => toast('🔗 Link copiado!'));
}

function propNew() {
  WIZ.init(null);
}

function propEdit(id) {
  const p = PROPOSALS.get(id);
  if (!p) { toast('Proposta não encontrada.', true); return; }
  WIZ.init(p);
}

function propDuplicate(id) {
  const p = PROPOSALS.get(id);
  if (!p) { toast('Proposta não encontrada.', true); return; }
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = '';
  copy.created_at = '';
  copy.status = 'open';
  copy.client = Object.assign({}, copy.client, { name: copy.client.name + ' (cópia)' });
  WIZ.init(copy);
}

async function propDelete(id) {
  if (!confirm('Excluir esta proposta? Esta ação não pode ser desfeita.')) return;
  const res = await PROPOSALS.remove(id);
  if (res.ok) {
    await PROPOSALS.load();
    toast('🗑 Proposta excluída.');
    showPage('propostas', document.querySelector('[data-page="propostas"]'));
  } else {
    toast('❌ Erro ao excluir: ' + res.error, true);
  }
}

/* ══════════════════════════════════════════
   PROPOSAL WIZARD
══════════════════════════════════════════ */
const WIZ = {
  step: 1,
  data: {},
  editId: null,

  _blank() {
    return {
      client: { name: '', internal_note: '' },
      validity: '',
      resort: { type: 'existing', slug: '', name: '', location: '', regime: '', images: [] },
      stay: { checkin: '', checkout: '', room_type: '', adults: 2, children: [] },
      accommodation_price: 0,
      accommodation_options: [],
      services: [],
      conditions: { payment_info: '', cancellation: '', legal_notes: '', whatsapp_message: '' }
    };
  },

  init(editData) {
    this.step = 1;
    if (editData) {
      this.editId = editData.id || null;
      this.data = JSON.parse(JSON.stringify(editData));
      if (!this.data.resort.images) this.data.resort.images = [];
      if (!this.data.accommodation_options) this.data.accommodation_options = [];
      if (!this.data.conditions) this.data.conditions = { payment_info: '', cancellation: '', legal_notes: '', whatsapp_message: '' };
    } else {
      this.editId = null;
      this.data = this._blank();
    }
    this.render();
  },

  render() {
    const stepNames = ['Cliente','Resort','Hospedagem','Serviços','Condições','Revisão'];
    const stepsHtml = stepNames.map((s, i) => {
      const n = i + 1;
      const cls = n < this.step ? 'done' : n === this.step ? 'active' : '';
      const clickable = n < this.step ? `onclick="WIZ.jumpTo(${n})"` : '';
      return `<div class="wiz-step-item ${cls}" ${clickable}>${n}. ${s}</div>`;
    }).join('');

    const isLast = this.step === 6;
    document.getElementById('mainInner').innerHTML = `
      <div class="wiz-container">
        <div class="wiz-header">
          <h1 class="page-title">${this.editId ? 'Editar Proposta' : 'Nova Proposta'}</h1>
          <button class="btn-ghost" onclick="WIZ.close()">← Voltar</button>
        </div>
        <div class="wiz-steps-bar">${stepsHtml}</div>
        <div class="wiz-body" id="wiz-body"></div>
        <div class="wiz-footer">
          <button class="btn-ghost" onclick="WIZ.prev()" style="visibility:${this.step === 1 ? 'hidden' : 'visible'}">← Voltar</button>
          <span class="wiz-progress">Passo ${this.step} de 6</span>
          ${isLast
            ? `<button class="btn-save" onclick="WIZ.saveAndFinish()">💾 Gerar link</button>`
            : `<button class="btn-save" onclick="WIZ.next()">Próximo →</button>`
          }
        </div>
      </div>`;
    this.renderBody();
  },

  renderBody() {
    const body = document.getElementById('wiz-body');
    if (body) body.innerHTML = this['renderStep' + this.step]();
    if (this.step === 4) this.updateTotal();
  },

  collect() {
    if (this.step === 1) this._collect1();
    if (this.step === 2) this._collect2();
    if (this.step === 3) this._collect3();
    if (this.step === 4) this._collect4();
    if (this.step === 5) this._collect5();
  },

  validate() {
    if (this.step === 1 && !this.data.client.name.trim()) {
      toast('⚠️ Informe o nome do cliente.', true); return false;
    }
    if (this.step === 2 && !this.data.resort.name.trim()) {
      toast('⚠️ Selecione ou informe o resort.', true); return false;
    }
    return true;
  },

  next() { this.collect(); if (!this.validate()) return; if (this.step < 6) { this.step++; this.render(); } },
  prev() { this.collect(); if (this.step > 1) { this.step--; this.render(); } },
  jumpTo(n) { this.collect(); this.step = n; this.render(); },
  close() { showPage('propostas', document.querySelector('[data-page="propostas"]')); },

  // ── STEP 1: Cliente ──
  renderStep1() {
    return `
      <div class="wiz-body-title">Dados do cliente</div>
      <div class="wiz-field-grid">
        <div class="field-row wiz-field">
          <label class="field-label">Nome do cliente *</label>
          <input id="w-name" class="field-input" value="${esc(this.data.client.name)}" placeholder="Ex: Ana Lima"/>
        </div>
        <div class="field-row wiz-field">
          <label class="field-label">Proposta válida até</label>
          <input id="w-validity" class="field-input" type="date" value="${esc(this.data.validity)}"/>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">Nota interna (não aparece para o cliente)</label>
        <textarea id="w-note" class="field-input" rows="2" placeholder="Ex: cliente indicado pela família Souza">${esc(this.data.client.internal_note)}</textarea>
      </div>`;
  },
  _collect1() {
    this.data.client.name = document.getElementById('w-name')?.value || '';
    this.data.validity = document.getElementById('w-validity')?.value || '';
    this.data.client.internal_note = document.getElementById('w-note')?.value || '';
  },

  // ── STEP 2: Resort ──
  renderStep2() {
    const isExisting = this.data.resort.type !== 'custom';
    const staticResorts = [
      { slug:'costao',      name:'Costão do Santinho' },
      { slug:'fazzenda',    name:'Fazzenda Park Resort' },
      { slug:'japaratinga', name:'Japaratinga Lounge Resort' },
    ];
    try {
      const custom = JSON.parse(localStorage.getItem('rsx_custom_pages') || '[]');
      custom.forEach(c => { if (!staticResorts.find(r => r.slug === c.slug)) staticResorts.push({ slug: c.slug, name: c.nome }); });
    } catch(e) {}
    const opts = staticResorts.map(r =>
      `<option value="${esc(r.slug)}" ${this.data.resort.slug===r.slug?'selected':''}>${esc(r.name)}</option>`
    ).join('');

    const existingPanel = `
      <div class="field-row">
        <label class="field-label">Resort</label>
        <select id="w-resort-slug" class="field-input" onchange="WIZ.onResortChange(this.value)">
          <option value="">— Selecione —</option>
          ${opts}
        </select>
      </div>
      ${this.data.resort.name ? `
        <div class="wiz-field-grid three" style="margin-top:10px">
          <div class="field-item-info"><div class="field-help">Resort</div><strong>${esc(this.data.resort.name)}</strong></div>
          <div class="field-item-info"><div class="field-help">Regime</div><strong>${esc(this.data.resort.regime||'—')}</strong></div>
          <div class="field-item-info"><div class="field-help">Vídeo</div><strong>${CMS.get(this.data.resort.slug,'hero_video_yt') ? '✓ Disponível' : '✕ Não configurado'}</strong></div>
        </div>` : ''}`;

    const customPanel = `
      <div class="wiz-field-grid">
        <div class="field-row wiz-field">
          <label class="field-label">Nome do hotel / resort *</label>
          <input id="w-custom-name" class="field-input" value="${esc(isExisting?'':this.data.resort.name)}" placeholder="Ex: Nannai Resort & Spa"/>
        </div>
        <div class="field-row wiz-field">
          <label class="field-label">Localização</label>
          <input id="w-custom-location" class="field-input" value="${esc(isExisting?'':this.data.resort.location)}" placeholder="Ex: Porto de Galinhas · PE"/>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">Regime alimentar</label>
        <input id="w-custom-regime" class="field-input" value="${esc(isExisting?'':this.data.resort.regime)}" placeholder="Ex: All-Inclusive · Meia Pensão"/>
      </div>
      <div class="field-row">
        <label class="field-label">Fotos do resort (até 5 · JPG/PNG/WebP)</label>
        <div id="w-img-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          ${(this.data.resort.images||[]).map((url,i)=>`<div style="position:relative;display:inline-block"><img src="${esc(url)}" style="width:72px;height:72px;object-fit:cover;border-radius:3px;border:1px solid var(--border)"/><button onclick="WIZ.removeImage(${i})" style="position:absolute;top:-4px;right:-4px;background:#f87171;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;line-height:18px">✕</button></div>`).join('')}
        </div>
        <input type="file" id="w-img-upload" accept="image/*" onchange="WIZ.uploadImage(this)" ${(this.data.resort.images||[]).length>=5?'disabled':''}/>
        <div class="field-help" id="w-img-status"></div>
      </div>`;

    return `
      <div class="wiz-body-title">Resort ou hotel</div>
      <div class="resort-toggle-wrap">
        <button class="resort-toggle-btn ${isExisting?'active':''}" onclick="WIZ.setResortType('existing')">🏖 Resort do site</button>
        <button class="resort-toggle-btn ${!isExisting?'active':''}" onclick="WIZ.setResortType('custom')">🏨 Outro hotel / resort</button>
      </div>
      ${isExisting ? existingPanel : customPanel}`;
  },

  setResortType(type) {
    this._collect2();
    this.data.resort.type = type;
    if (type === 'existing') {
      this.data.resort.name = '';
      this.data.resort.slug = '';
      this.data.resort.location = '';
      this.data.resort.regime = '';
    }
    this.renderBody();
  },

  onResortChange(slug) {
    if (!slug) { this.data.resort = Object.assign(this.data.resort, { slug:'', name:'', location:'', regime:'' }); return; }
    const names = { costao:'Costão do Santinho', fazzenda:'Fazzenda Park Resort', japaratinga:'Japaratinga Lounge Resort' };
    const custom = (() => { try { return JSON.parse(localStorage.getItem('rsx_custom_pages')||'[]'); } catch(e){return[];} })();
    const customPage = custom.find(c => c.slug === slug);
    this.data.resort.slug = slug;
    this.data.resort.name = names[slug] || (customPage && customPage.nome) || slug;
    this.data.resort.regime = CMS.get(slug, 'regime') || '';
    this.data.resort.location = CMS.get(slug, 'meta_localizacao') || '';
    this.renderBody();
  },

  _collect2() {
    if (this.data.resort.type === 'existing') {
      const sel = document.getElementById('w-resort-slug');
      if (sel) this.onResortChange(sel.value);
    } else {
      this.data.resort.name     = document.getElementById('w-custom-name')?.value || '';
      this.data.resort.location = document.getElementById('w-custom-location')?.value || '';
      this.data.resort.regime   = document.getElementById('w-custom-regime')?.value || '';
    }
  },

  async uploadImage(input) {
    if (!input.files || !input.files[0]) return;
    const status = document.getElementById('w-img-status');
    if (status) status.textContent = 'Enviando...';
    const fd = new FormData();
    fd.append('file', input.files[0]);
    fd.append('_pass', CMS.pass());
    try {
      const r = await fetch('upload.php', { method: 'POST', body: fd });
      const res = await r.json();
      if (res.ok) {
        if (!this.data.resort.images) this.data.resort.images = [];
        this.data.resort.images.push(res.url);
        this.renderBody();
      } else {
        if (status) status.textContent = '❌ ' + res.error;
      }
    } catch(e) {
      if (status) status.textContent = '❌ Falha no upload.';
    }
    input.value = '';
  },

  removeImage(idx) {
    this.data.resort.images.splice(idx, 1);
    this.renderBody();
  },

  // ── STEP 3: Hospedagem ──
  _resortName(slug) {
    const names = { costao:'Costão do Santinho', fazzenda:'Fazzenda Park Resort', japaratinga:'Japaratinga Lounge Resort' };
    if (names[slug]) return names[slug];
    try { const c = JSON.parse(localStorage.getItem('rsx_custom_pages')||'[]'); const p = c.find(x=>x.slug===slug); if(p) return p.nome; } catch(e){}
    return slug;
  },

  renderStep3() {
    const children = this.data.stay.children || [];
    const childrenHtml = children.map((age, i) => `
      <div class="children-row">
        <input class="field-input children-age-input" type="number" min="0" max="17" value="${age}" placeholder="Idade" data-child="${i}"/>
        <button class="btn-ghost" style="padding:4px 8px" onclick="WIZ.removeChild(${i})">✕</button>
      </div>`).join('');

    // Options — always start with at least the primary option
    const opts = this.data.accommodation_options && this.data.accommodation_options.length
      ? this.data.accommodation_options
      : [{ label:'Opção 1', resort_slug: this.data.resort.slug||'', resort_name: this.data.resort.name||'', room_type: this.data.stay.room_type||'', price: this.data.accommodation_price||0, notes:'' }];

    const mainSlug = this.data.resort.slug || '';
    const mainName = this.data.resort.name || '';

    const optCards = opts.map((opt, i) => {
      const isDiff = opt.resort_slug && opt.resort_slug !== mainSlug;
      return `
        <div class="accom-opt-card" data-opt="${i}">
          <div class="accom-opt-header">
            <input class="field-input accom-opt-label" value="${esc(opt.label||('Opção '+(i+1)))}" placeholder="Ex: Opção Econômica"/>
            ${opts.length > 1 ? `<button class="btn-ghost" style="padding:4px 10px;font-size:11px;color:rgba(248,113,113,.7)" onclick="WIZ.removeAccomOpt(${i})">✕ Remover</button>` : ''}
          </div>
          <div style="margin-bottom:10px">
            <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);cursor:pointer;margin-bottom:8px">
              <input type="checkbox" id="opt-diff-${i}" ${isDiff?'checked':''} onchange="WIZ.toggleOptResort(${i},this.checked)"/>
              Resort diferente do principal (${esc(mainName||'selecione no passo 2')})
            </label>
            ${isDiff ? `
              <div class="wiz-field-grid" style="margin-bottom:8px">
                <div class="field-row wiz-field">
                  <label class="field-label">Nome do hotel / resort</label>
                  <input class="field-input accom-opt-resort-name" value="${esc(opt.resort_name)}" placeholder="Ex: Japaratinga Lounge Resort"/>
                </div>
                <div class="field-row wiz-field">
                  <label class="field-label">Regime</label>
                  <input class="field-input accom-opt-resort-regime" value="${esc(opt.resort_regime||'')}" placeholder="Ex: All-Inclusive Premium"/>
                </div>
              </div>` : ''}
          </div>
          <div class="wiz-field-grid">
            <div class="field-row wiz-field">
              <label class="field-label">Tipo de quarto / acomodação</label>
              <input class="field-input accom-opt-room" value="${esc(opt.room_type)}" placeholder="Ex: Chalé Vista Mar · Superior"/>
            </div>
            <div class="field-row wiz-field">
              <label class="field-label">Valor da hospedagem (R$)</label>
              <input class="field-input accom-opt-price" type="number" min="0" value="${opt.price||0}" oninput="WIZ.updateTotal()"/>
            </div>
          </div>
          <div class="field-row">
            <label class="field-label">Observações desta opção (opcional)</label>
            <textarea class="field-input accom-opt-notes" rows="2" placeholder="Ex: Vista para o mar · Varanda privativa · Inclui frigobar">${esc(opt.notes||'')}</textarea>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="wiz-body-title">Hospedagem & opções</div>
      <div class="info-box" style="margin-bottom:20px">Você pode apresentar <strong>até 3 opções de quarto ou hotel</strong> na mesma proposta — o cliente vê todas e escolhe a que preferir.</div>

      <div class="wiz-field-grid" style="margin-bottom:20px">
        <div class="field-row wiz-field">
          <label class="field-label">Check-in</label>
          <input id="w-checkin" class="field-input" type="date" value="${esc(this.data.stay.checkin)}"/>
        </div>
        <div class="field-row wiz-field">
          <label class="field-label">Check-out</label>
          <input id="w-checkout" class="field-input" type="date" value="${esc(this.data.stay.checkout)}"/>
        </div>
        <div class="field-row wiz-field">
          <label class="field-label">Nº de adultos</label>
          <input id="w-adults" class="field-input" type="number" min="1" max="20" value="${this.data.stay.adults||2}"/>
        </div>
        <div class="field-row wiz-field">
          <label class="field-label">Crianças</label>
          <div id="w-children-list">${childrenHtml}</div>
          <button class="btn-ghost" style="margin-top:4px;font-size:11px" onclick="WIZ.addChild()">+ Adicionar criança</button>
        </div>
      </div>

      <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)">
        Opções de acomodação
      </div>
      <div id="w-accom-opts">${optCards}</div>
      <button class="btn-ghost" style="width:100%;margin-top:8px;font-size:12px" onclick="WIZ.addAccomOpt()">+ Adicionar outra opção de quarto / hotel</button>
    `;
  },

  addAccomOpt() {
    this._collect3();
    const i = this.data.accommodation_options.length + 1;
    this.data.accommodation_options.push({ label:'Opção '+(i+1), resort_slug:'', resort_name:'', resort_regime:'', room_type:'', price:0, notes:'' });
    this.renderBody();
  },

  removeAccomOpt(i) {
    this._collect3();
    this.data.accommodation_options.splice(i, 1);
    this.renderBody();
  },

  toggleOptResort(i, checked) {
    this._collect3();
    if (!checked) {
      this.data.accommodation_options[i].resort_slug = '';
      this.data.accommodation_options[i].resort_name = '';
      this.data.accommodation_options[i].resort_regime = '';
    }
    this.renderBody();
  },

  addChild() {
    this._collect3();
    this.data.stay.children.push(0);
    this.renderBody();
  },

  removeChild(i) {
    this._collect3();
    this.data.stay.children.splice(i, 1);
    this.renderBody();
  },

  _collect3() {
    this.data.stay.checkin  = document.getElementById('w-checkin')?.value || '';
    this.data.stay.checkout = document.getElementById('w-checkout')?.value || '';
    this.data.stay.adults   = parseInt(document.getElementById('w-adults')?.value||2, 10);
    document.querySelectorAll('[data-child]').forEach(inp => {
      const i = parseInt(inp.dataset.child, 10);
      this.data.stay.children[i] = parseInt(inp.value||0, 10);
    });
    // Collect accommodation options
    const cards = document.querySelectorAll('[data-opt]');
    this.data.accommodation_options = Array.from(cards).map((card, i) => {
      const isDiff = card.querySelector('#opt-diff-'+i)?.checked;
      return {
        label:         card.querySelector('.accom-opt-label')?.value || ('Opção '+(i+1)),
        resort_slug:   isDiff ? '' : (this.data.resort.slug||''),
        resort_name:   isDiff ? (card.querySelector('.accom-opt-resort-name')?.value||'') : (this.data.resort.name||''),
        resort_regime: isDiff ? (card.querySelector('.accom-opt-resort-regime')?.value||'') : (this.data.resort.regime||''),
        room_type:     card.querySelector('.accom-opt-room')?.value || '',
        price:         parseFloat(card.querySelector('.accom-opt-price')?.value||0),
        notes:         card.querySelector('.accom-opt-notes')?.value || '',
      };
    });
    // Sync primary fields for backward compat
    if (this.data.accommodation_options.length) {
      this.data.stay.room_type        = this.data.accommodation_options[0].room_type;
      this.data.accommodation_price   = this.data.accommodation_options[0].price;
    }
  },

  // ── STEP 4: Serviços ──
  renderStep4() {
    const presets = [
      { icon:'✈️', type:'flight',    label:'CWB → ??? · Ida e volta' },
      { icon:'🚐', type:'transfer',  label:'Transfer aeroporto → resort' },
      { icon:'🛡️', type:'insurance', label:'Seguro viagem completo' },
      { icon:'🏖️', type:'tour',      label:'Passeio — descreva aqui' },
      { icon:'➕', type:'other',     label:'Descreva o serviço aqui' },
    ];
    const presetsHtml = presets.map(p =>
      `<button class="svc-preset-btn" onclick="WIZ.addService('${p.icon}','${p.type}','${p.label}')">${p.icon} ${p.icon==='✈️'?'Aéreo':p.icon==='🚐'?'Transfer':p.icon==='🛡️'?'Seguro':p.icon==='🏖️'?'Passeio':'Outro'}</button>`
    ).join('');

    const svcPlaceholders = { flight:'Ex: CWB → FLN · Ida e volta · 2 adultos + 1 criança (8a)', transfer:'Ex: Transfer aeroporto → resort · 3 pessoas', insurance:'Ex: Seguro viagem completo · 8 dias · 3 pessoas', tour:'Ex: Passeio de barco pelas piscinas naturais', other:'Descreva o serviço aqui' };
    const svcsHtml = (this.data.services||[]).map((sv, i) => {
      const ph = svcPlaceholders[sv.type||'other'] || 'Descreva o serviço';
      return `
      <div class="svc-row" data-svc="${i}" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <input class="svc-icon-input" value="${esc(sv.icon||'➕')}" maxlength="2" title="Emoji"/>
          <input class="svc-price-input" type="number" min="0" value="${sv.price||0}" placeholder="R$" oninput="WIZ.updateTotal()" style="width:120px;text-align:left"/>
          <button class="svc-remove-btn" onclick="WIZ.removeService(${i})">✕ Remover</button>
        </div>
        <textarea class="svc-desc-input" rows="2" placeholder="${esc(ph)}" style="width:100%;resize:vertical">${esc(sv.description)}</textarea>
      </div>`;
    }).join('');

    return `
      <div class="wiz-body-title">Serviços incluídos na proposta</div>
      <div class="svc-add-presets">${presetsHtml}</div>
      <div id="w-svc-list">${svcsHtml || '<div style="color:var(--text-dim);font-size:12px;margin-bottom:10px">Nenhum serviço adicionado ainda.</div>'}</div>
      <div class="wiz-total">
        <span class="wiz-total-lbl">Total geral (hospedagem + serviços)</span>
        <span class="wiz-total-val" id="w-total">R$ 0</span>
      </div>`;
  },

  addService(icon, type, label) {
    this._collect4();
    this.data.services.push({ icon, type, description: label, price: 0 });
    this.renderBody();
  },

  removeService(i) {
    this._collect4();
    this.data.services.splice(i, 1);
    this.renderBody();
  },

  updateTotal() {
    const acc = parseFloat(document.getElementById('w-acc-price')?.value || this.data.accommodation_price || 0);
    const svcTotal = Array.from(document.querySelectorAll('.svc-price-input'))
      .reduce((s, inp) => s + parseFloat(inp.value||0), 0);
    const total = acc + svcTotal;
    const el = document.getElementById('w-total');
    if (el) el.textContent = 'R$ ' + total.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  },

  _collect4() {
    this.data.services = Array.from(document.querySelectorAll('[data-svc]')).map(row => ({
      icon:        row.querySelector('.svc-icon-input')?.value || '➕',
      type:        'other',
      description: row.querySelector('.svc-desc-input')?.value || '',
      price:       parseFloat(row.querySelector('.svc-price-input')?.value || 0),
    }));
  },

  // ── STEP 5: Condições ──
  renderStep5() {
    const checkin = this.data.stay.checkin ? ' de ' + this.data.stay.checkin.split('-').reverse().join('/') : '';
    const checkout = this.data.stay.checkout ? ' a ' + this.data.stay.checkout.split('-').reverse().join('/') : '';
    const autoMsg = this.data.conditions.whatsapp_message ||
      `Oi Rebeca! Sou ${this.data.client.name||'seu cliente'}, quero confirmar minha proposta de viagem para o ${this.data.resort.name||'resort'}${checkin}${checkout}. Pode me ajudar?`;
    return `
      <div class="wiz-body-title">Condições e informações</div>
      <div class="field-row">
        <label class="field-label">Forma de pagamento</label>
        <textarea id="w-payment" class="field-input" rows="2" placeholder="Ex: 30% de entrada + 70% até 30 dias antes">${esc(this.data.conditions.payment_info)}</textarea>
      </div>
      <div class="field-row">
        <label class="field-label">Política de cancelamento</label>
        <textarea id="w-cancel" class="field-input" rows="2" placeholder="Ex: Cancelamento gratuito até 60 dias antes do check-in">${esc(this.data.conditions.cancellation)}</textarea>
      </div>
      <div class="field-row">
        <label class="field-label">Informações legais / observações gerais</label>
        <textarea id="w-legal" class="field-input" rows="2" placeholder="Proposta sujeita à disponibilidade...">${esc(this.data.conditions.legal_notes)}</textarea>
      </div>
      <div class="field-row">
        <label class="field-label">Mensagem WhatsApp pré-preenchida para o cliente</label>
        <textarea id="w-wa-msg" class="field-input" rows="2">${esc(autoMsg)}</textarea>
        <div class="field-help">O cliente verá essa mensagem ao clicar em "Quero essa viagem!"</div>
      </div>`;
  },

  _collect5() {
    this.data.conditions.payment_info      = document.getElementById('w-payment')?.value || '';
    this.data.conditions.cancellation      = document.getElementById('w-cancel')?.value || '';
    this.data.conditions.legal_notes       = document.getElementById('w-legal')?.value || '';
    this.data.conditions.whatsapp_message  = document.getElementById('w-wa-msg')?.value || '';
  },

  // ── STEP 6: Revisão ──
  renderStep6() {
    const total = [this.data.accommodation_price, ...(this.data.services||[]).map(s=>s.price)]
      .reduce((a,b) => a + Number(b||0), 0);
    const fmtMoney = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0});
    const fmtDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); const ms=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return `${parseInt(d,10)} ${ms[parseInt(m,10)-1]} ${y}`; };

    const svcsRows = [
      { icon:'🏨', description: this.data.stay.room_type || 'Hospedagem', price: this.data.accommodation_price },
      ...(this.data.services||[])
    ].filter(s => Number(s.price) > 0).map(s =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px"><span>${esc(s.icon||'🏨')} ${esc(s.description)}</span><span style="color:var(--gold-dim)">${fmtMoney(s.price)}</span></div>`
    ).join('');

    return `
      <div class="wiz-body-title">Revisão — como o cliente vai ver</div>
      <div style="display:flex;align-items:center;gap:10px;background:rgba(220,192,147,.09);border:1px solid rgba(220,192,147,.3);border-radius:4px;padding:10px 14px;margin-bottom:14px">
        <span style="font-size:16px">🏨</span>
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold-dim)">Resort selecionado</div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(this.data.resort.name||'⚠️ Nenhum resort selecionado!')}</div>
        </div>
        <button class="btn-ghost" style="margin-left:auto;font-size:10px;padding:4px 10px" onclick="WIZ.jumpTo(2)">Alterar</button>
      </div>
      <div style="background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:16px">
        <div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px">${esc(this.data.resort.regime||'')}</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--text);margin-bottom:4px">${esc(this.data.resort.name||'—')}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:16px">${esc(this.data.resort.location||'')}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:16px">Proposta para <strong>${esc(this.data.client.name||'—')}</strong>${this.data.validity?' · Válida até '+fmtDate(this.data.validity):''}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:3px;padding:10px"><div style="font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:3px">Check-in</div>${fmtDate(this.data.stay.checkin)}</div>
          <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:3px;padding:10px"><div style="font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:3px">Check-out</div>${fmtDate(this.data.stay.checkout)}</div>
        </div>
        ${svcsRows}
        <div style="background:rgba(220,192,147,.07);border:1px solid rgba(220,192,147,.2);border-radius:3px;padding:10px;display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <span style="font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim)">Total da viagem</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold-dim)">${fmtMoney(total)}</span>
        </div>
      </div>
      <div id="wiz-link-result"></div>
      <p style="font-size:11px;color:var(--text-dim)">Clique em "💾 Gerar link" para salvar e obter o link do cliente.</p>`;
  },

  // ── SAVE ──
  async saveAndFinish() {
    this.collect();

    if (!this.editId) {
      const slugify = s => String(s||'').toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g,'')
        .replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
      const clientPart = slugify(this.data.client.name).substring(0, 15).replace(/-+$/, '');
      const resortPart = slugify(this.data.resort.name).substring(0, 10).replace(/-+$/, '');
      const monthPart  = (this.data.stay.checkin || new Date().toISOString())
        .substring(0, 7).replace('-', '');
      let base = `${clientPart}-${resortPart}-${monthPart}`;
      let candidate = base;
      const all = PROPOSALS.all();
      let n = 2;
      while (all.find(p => p.id === candidate)) { candidate = base + '-' + n++; }
      this.data.id = candidate;
      this.data.created_at = new Date().toISOString().substring(0, 10);
      this.data.status = 'open';
    } else {
      this.data.id = this.editId;
    }

    const btn = document.querySelector('.wiz-footer .btn-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

    const res = await PROPOSALS.save(this.data);

    if (btn) { btn.disabled = false; btn.textContent = '💾 Gerar link'; }

    if (res.ok) {
      await PROPOSALS.load();
      const link = PROPOSALS.propLink(this.data.id);
      const el = document.getElementById('wiz-link-result');
      if (el) {
        el.innerHTML = `
          <div class="link-result">
            <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(74,222,128,.7);margin-bottom:8px">✓ Proposta salva com sucesso!</div>
            <div class="link-result-url">${esc(link)}</div>
            <div style="display:flex;gap:8px">
              <button class="link-copy-btn" onclick="navigator.clipboard.writeText('${esc(link)}').then(()=>toast('🔗 Link copiado!'))">📋 Copiar link</button>
              <a href="${esc(link)}" target="_blank" class="btn-ghost" style="font-size:10px;padding:7px 14px">↗ Abrir proposta</a>
            </div>
          </div>`;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      toast('✅ Proposta salva!');
    } else {
      toast('❌ Erro ao salvar: ' + (res.error || 'desconhecido'), true);
    }
  },
};

/* ══════════════════════════════════════════

const CUSTOM_KEY = 'rsx_custom_pages';

function loadCustomPages() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveCustomPages(list) {
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(list));
}
function renderCustomPageNav() {
  const list = loadCustomPages();
  const nav  = document.getElementById('custom-pages-nav');
  if (!nav) return;
  nav.innerHTML = list.map(p => `
    <button class="nav-btn" data-page="${esc(p.slug)}" onclick="showPage('${esc(p.slug)}',this)">
      <span class="nav-icon">🏨</span><span style="flex:1;text-align:left">${esc(p.nome)}</span>
    </button>
  `).join('');
  // Register page renderers for each custom page
  list.forEach(p => {
    if (!PAGES[p.slug]) {
      PAGES[p.slug] = () => resortHTML(p.slug, p.nome, p.slug + '.html');
    }
  });
}

function slugify(str) {
  return (str || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
}
function updateSlug() {
  const nome = document.getElementById('nd_nome')?.value || '';
  const slugEl = document.getElementById('nd_slug');
  if (slugEl && !slugEl.dataset.manual) slugEl.value = slugify(nome);
}

async function gerarDestino() {
  const nome = (document.getElementById('nd_nome')?.value || '').trim();
  if (!nome) { toast('Preencha o nome do resort.', true); return; }

  const slug   = (document.getElementById('nd_slug')?.value || '').trim() || slugify(nome);
  const loc    = (document.getElementById('nd_loc')?.value   || '').trim() || 'Brasil';
  const regime = (document.getElementById('nd_regime')?.value|| '').trim() || 'All-Inclusive';
  const cat    = (document.getElementById('nd_cat')?.value   || '').trim() || '5 Estrelas';
  const coord  = (document.getElementById('nd_coord')?.value || '').trim() || '—';
  const tags   = (document.getElementById('nd_tags')?.value  || '').trim() || '';
  const h2     = (document.getElementById('nd_h2')?.value    || '').trim() || `Descubra o ${nome}.`;
  const p1     = (document.getElementById('nd_p1')?.value    || '').trim();
  const p2     = (document.getElementById('nd_p2')?.value    || '').trim();
  const p3     = (document.getElementById('nd_p3')?.value    || '').trim();
  const quote  = (document.getElementById('nd_quote')?.value || '').trim() || `"${nome} é um destino que fica na memória."`;
  const stats  = [1,2,3,4].map(i => ({
    n: (document.getElementById(`nd_sn${i}`)?.value || '').trim() || '—',
    l: (document.getElementById(`nd_sl${i}`)?.value || '').trim() || 'Destaque'
  }));

  try {
    toast('Buscando template...');
    const res = await fetch('costao.html');
    if (!res.ok) throw new Error('Não conseguiu carregar o template');
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    // Title & meta
    doc.title = `${nome} — RSX Travel · Rebeca Piccolo`;
    const md = doc.querySelector('meta[name="description"]');
    if (md) md.content = `${nome} — curadoria personalizada RSX Travel. ${loc}.`;

    // Hero h1
    const h1el = doc.querySelector('.page-hero h1');
    if (h1el) {
      const words = nome.split(' ');
      h1el.innerHTML = words.length > 1
        ? words.slice(0,-1).join(' ') + '<br/><em>' + words.slice(-1)[0] + '.</em>'
        : '<em>' + nome + '.</em>';
    }

    // Badge
    const badge = doc.querySelector('.hero-badge');
    if (badge) badge.textContent = `${regime.toUpperCase()} · ${loc.toUpperCase()}`;

    // Tags (subtitle)
    const heroTags = doc.querySelector('.hero-tags');
    if (heroTags) heroTags.textContent = tags || `RESORT · ${loc.toUpperCase()}`;

    // Meta items
    const metaDefs = [
      { l: 'LOCALIZAÇÃO', v: loc },
      { l: 'REGIME',      v: regime },
      { l: 'CATEGORIA',   v: cat },
      { l: 'COORDENADAS', v: coord },
    ];
    doc.querySelectorAll('.hero-meta-item').forEach((item, i) => {
      if (!metaDefs[i]) return;
      const lbl = item.querySelector('.meta-label, .hero-meta-label');
      const val = item.querySelector('.meta-value, .hero-meta-value');
      if (lbl) lbl.textContent = metaDefs[i].l;
      if (val) val.textContent = metaDefs[i].v;
    });

    // Overview
    const oh2 = doc.querySelector('.overview-text .section-h2');
    if (oh2) oh2.innerHTML = h2;
    const ps = doc.querySelectorAll('.overview-text > p');
    [p1, p2, p3].forEach((txt, i) => { if (txt && ps[i]) ps[i].textContent = txt; });

    // Stats
    const sNums = doc.querySelectorAll('.stat-number');
    const sLbls = doc.querySelectorAll('.stat-label');
    stats.forEach((s,i) => {
      if (sNums[i]) sNums[i].textContent = s.n;
      if (sLbls[i]) sLbls[i].textContent = s.l;
    });

    // Experience quote & bg text
    const q = doc.querySelector('.experience-quote');
    if (q) q.textContent = quote;
    const bgTxt = doc.querySelector('.experience-bg-text');
    if (bgTxt) bgTxt.textContent = nome.split(' ')[0];

    // WhatsApp links
    const waMsg = encodeURIComponent(`Oi Rebeca, quero saber mais sobre ${nome}!`);
    doc.querySelectorAll('a[href*="wa.me"]').forEach(a => {
      a.href = `https://wa.me/5541988429348?text=${waMsg}`;
    });

    // Add content-override.js if not already there
    if (!doc.querySelector('script[src="content-override.js"]')) {
      const s = doc.createElement('script');
      s.src = 'content-override.js';
      doc.head.appendChild(s);
    }

    // Download
    const final = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    const blob  = new Blob([final], { type: 'text/html;charset=utf-8' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href = url; a.download = slug + '.html';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Register custom page so it appears in sidebar + home page card
    const existing = loadCustomPages().filter(p => p.slug !== slug);
    saveCustomPages([...existing, {
      slug, nome,
      localizacao: loc,
      regime,
      desc: p1 ? p1.slice(0, 90).replace(/\s\S+$/, '…') : ''
    }]);
    renderCustomPageNav();

    // Success message
    const result = document.getElementById('nd_result');
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `<div class="info-box">
        <strong>✅ Arquivo gerado: ${esc(slug)}.html</strong><br/><br/>
        <strong>Próximos passos:</strong><br/>
        1. Salve o arquivo <code>${esc(slug)}.html</code> na pasta do site (junto com index.html, costao.html, etc).<br/>
        2. Para adicionar fotos e editar textos depois: o resort já aparece no painel à esquerda como <strong>🏨 ${esc(nome)}</strong>.<br/>
        3. Para aparecer na página inicial, edite <code>index.html</code> e adicione um card para este destino.
      </div>`;
    }
    toast(`✅ ${slug}.html gerado e registrado!`);
  } catch(err) {
    console.error(err);
    toast('Erro ao gerar a página. Verifique se o servidor está rodando.', true);
  }
}

function changePass() {
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  if (!p1)        return toast('Digite a nova senha.', true);
  if (p1 !== p2)  return toast('As senhas não coincidem.', true);
  if (p1.length < 4) return toast('Senha muito curta (mín. 4 caracteres).', true);
  CMS.setPass(p1);
  document.getElementById('p1').value = '';
  document.getElementById('p2').value = '';
  toast('Senha alterada com sucesso!');
}
