<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Proposta de Viagem — RSX Travel</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy-950:#080f1f;--navy-900:#0e1a35;--navy-800:#1a2847;--navy-700:#233357;
  --gold-600:#a07840;--gold-500:#b8935c;--gold-400:#c9a574;--gold-300:#dcc093;--gold-200:#edda9f;
  --cream:#f5efe6;--line:rgba(201,165,116,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--navy-950);color:var(--cream);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--line)}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:.25em;color:var(--gold-300)}
.topbar-tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,239,230,.35)}

/* ── HERO ── */
.hero{position:relative;min-height:500px;display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:var(--navy-800);transition:opacity .5s}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--navy-950) 0%,rgba(8,15,31,.55) 55%,rgba(8,15,31,.15) 100%)}
.hero-content{position:relative;z-index:1;padding:48px 40px;width:100%;max-width:900px}
.hero-eyebrow{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-300);margin-bottom:10px}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(40px,7vw,80px);font-weight:400;line-height:.92;color:var(--cream);letter-spacing:-.02em;margin-bottom:10px}
.hero-location{font-size:12px;color:rgba(245,239,230,.5);letter-spacing:.08em}
.hero-video-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:rgba(201,165,116,.12);border:1px solid rgba(201,165,116,.3);border-radius:20px;padding:7px 16px;font-size:11px;color:var(--gold-300);cursor:pointer;transition:.2s;letter-spacing:.04em}
.hero-video-btn:hover{background:rgba(201,165,116,.22)}
.video-expand{display:none;padding:0 40px 32px}
.video-expand.open{display:block}
.video-wrap{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* ── CLIENT BAR ── */
.client-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 40px;background:rgba(201,165,116,.06);border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.client-name{font-size:13px;color:var(--cream);font-weight:500}
.client-validity{font-size:11px;color:rgba(245,239,230,.4);letter-spacing:.03em}

/* ── GALLERY STRIP ── */
.gallery-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:200px;overflow:hidden}
.gallery-strip-img{background-size:cover;background-position:center;background-color:var(--navy-800)}

/* ── LAYOUT ── */
.prop-body{max-width:720px;margin:0 auto;padding:48px 40px 100px}
.section-eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-400);font-weight:600;margin-bottom:14px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,40px);font-weight:400;color:var(--cream);margin-bottom:20px;line-height:1.1}

/* ── RESORT OVERVIEW ── */
.resort-overview{margin-bottom:48px}
.resort-overview-text{font-size:15px;color:rgba(245,239,230,.7);line-height:1.8;font-weight:300}
.resort-overview-text + .resort-overview-text{margin-top:12px}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:48px}
.stat-item{background:rgba(255,255,255,.025);padding:18px 16px;text-align:center}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--gold-300);line-height:1;margin-bottom:4px}
.stat-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,239,230,.4)}

/* ── HIGHLIGHTS ── */
.highlights-section{margin-bottom:48px}
.highlights-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.highlight-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:20px}
.highlight-title{font-size:13px;color:var(--gold-300);font-weight:600;margin-bottom:6px}
.highlight-desc{font-size:12px;color:rgba(245,239,230,.55);line-height:1.6}

/* ── ACCOMMODATION OPTIONS ── */
.accom-opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:32px}
.accom-opt-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px}
.accom-opt-badge{display:inline-block;background:rgba(201,165,116,.12);border:1px solid rgba(201,165,116,.25);border-radius:20px;padding:3px 12px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-300);width:fit-content;margin-bottom:4px}
.accom-opt-resort{font-size:11px;color:var(--gold-400);font-weight:500}
.accom-opt-room{font-size:15px;color:var(--cream);font-weight:500;line-height:1.3}
.accom-opt-notes{font-size:11px;color:rgba(245,239,230,.45);line-height:1.5}
.accom-opt-price-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(245,239,230,.55);margin-top:4px}
.accom-opt-acc{font-size:12px}
.accom-opt-acc-val{font-size:12px;color:rgba(245,239,230,.7)}
.accom-opt-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.accom-opt-total span:first-child{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(245,239,230,.4)}
.accom-opt-total span:last-child{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-300)}
/* ── ESTADIA ── */
.stay-section{margin-bottom:40px}
.stay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stay-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:3px;padding:14px 16px}
.stay-item-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:rgba(245,239,230,.3);margin-bottom:5px}
.stay-item-val{font-size:14px;color:var(--cream);font-weight:400}
.stay-nights-badge{display:inline-block;background:rgba(201,165,116,.12);border:1px solid rgba(201,165,116,.25);border-radius:20px;padding:3px 12px;font-size:10px;color:var(--gold-300);letter-spacing:.06em;margin-top:12px}

/* ── SERVICES ── */
.services-section{margin-bottom:32px}
.service-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.service-row:last-child{border-bottom:none}
.service-left{display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(245,239,230,.75);flex:1;min-width:0}
.service-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.service-desc{flex:1;min-width:0}
.service-price{font-size:13px;color:var(--gold-300);font-weight:500;white-space:nowrap;margin-left:16px}

/* ── TOTAL ── */
.total-box{background:rgba(201,165,116,.07);border:1px solid rgba(201,165,116,.22);border-radius:4px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
.total-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:rgba(245,239,230,.45)}
.total-val{font-family:'Cormorant Garamond',serif;font-size:42px;color:var(--gold-300);letter-spacing:-.01em;line-height:1}

/* ── CTA ── */
.cta-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#25D366;color:#fff;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;border:none;padding:18px;border-radius:3px;cursor:pointer;transition:.2s;text-decoration:none;margin-bottom:32px}
.cta-btn:hover{background:#1da855}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--line);margin:40px 0}

/* ── CONDITIONS ── */
.conditions{}
.cond-item{margin-bottom:20px}
.cond-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-400);margin-bottom:5px}
.cond-text{font-size:12px;color:rgba(245,239,230,.45);line-height:1.75}

/* ── FOOTER ── */
.prop-footer{text-align:center;padding:28px 40px 40px;border-top:1px solid var(--line)}
.prop-footer-logo{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.25em;color:var(--gold-400);margin-bottom:5px}
.prop-footer-tag{font-size:10px;color:rgba(245,239,230,.2);letter-spacing:.06em}

/* ── ERROR / LOADING ── */
.error-state{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:16px}
.error-title{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--gold-300)}
.error-sub{font-size:14px;color:rgba(245,239,230,.4);max-width:360px;line-height:1.7}
.loading-state{min-height:60vh;display:flex;align-items:center;justify-content:center}
.loading-bar{width:120px;height:1px;background:rgba(201,165,116,.15);position:relative;overflow:hidden}
.loading-bar::after{content:'';position:absolute;left:-50%;width:50%;height:100%;background:var(--gold-300);animation:load .8s ease-in-out infinite}
@keyframes load{to{left:100%}}

/* ── BAILA COSTÃO PROPOSAL ── */
.baila-hero{position:relative;min-height:340px;padding:0;overflow:hidden;background:var(--navy-800)}
.baila-hero-bg{position:absolute;inset:0;background-image:url('https://rsxtravel.com.br/midia/costao-do-santinho-resort-all-inclusive_-1779812032.jpg');background-size:cover;background-position:center}
.baila-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--navy-950) 4%,rgba(8,15,31,.55) 55%,rgba(8,15,31,.35) 100%)}
.baila-hero-inner{position:relative;z-index:1;text-align:center;padding:40px 40px 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:340px}
.baila-hero-logo{height:140px;width:auto;margin:0 auto 16px}
.baila-hero-eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-300);margin-bottom:10px}
.baila-hero-name{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:400;line-height:.98;color:var(--cream);letter-spacing:-.01em;margin-bottom:8px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.baila-hero-location{font-size:12px;color:rgba(245,239,230,.6);letter-spacing:.08em}
.baila-event-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:4px;padding:16px 20px;margin-top:6px}
.baila-event-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-300);line-height:1.1;margin-bottom:4px}
.baila-event-meta{font-size:12px;color:rgba(245,239,230,.55);letter-spacing:.03em}
.baila-cat-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.055)}
.baila-cat-row:last-child{border-bottom:none}
.baila-cat-name{font-size:13px;color:var(--cream);font-weight:400;line-height:1.3}
.baila-cat-detail{font-size:10px;color:rgba(245,239,230,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.baila-cat-price{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold-300);white-space:nowrap;line-height:1}
.baila-kids-box{display:flex;gap:10px;margin-top:14px}
.baila-kids-item{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:3px;padding:12px 14px}
.baila-kids-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:rgba(245,239,230,.35);margin-bottom:5px}
.baila-kids-val{font-size:14px;color:var(--gold-200)}
.baila-incl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.baila-incl-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:15px 16px}
.baila-incl-title{font-size:12px;color:var(--gold-300);font-weight:600;margin-bottom:5px}
.baila-incl-desc{font-size:11px;color:rgba(245,239,230,.55);line-height:1.6}
.baila-alert{margin-top:16px;background:rgba(201,165,116,.07);border:1px solid rgba(201,165,116,.22);border-radius:4px;padding:12px 16px;font-size:11px;color:rgba(245,239,230,.6);line-height:1.6}
.baila-alert strong{color:var(--gold-200)}
.baila-sig-msg{font-size:12px;color:rgba(245,239,230,.6);line-height:1.7;font-weight:300;text-align:center;margin:30px 0 22px}
.baila-signature{display:flex;align-items:center;gap:22px;padding:22px 24px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px}
.baila-sig-avatar{width:82px;height:82px;border-radius:50%;background-image:url('https://rsxtravel.com.br/midia/site-1779999623.jpg');background-size:cover;background-position:center 20%;border:2px solid rgba(201,165,116,.45);flex-shrink:0}
.baila-sig-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold-300);line-height:1;margin-bottom:4px}
.baila-sig-role{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-500);margin-bottom:12px}
.baila-sig-contacts{display:flex;flex-wrap:wrap;gap:7px}
.baila-sig-chip{font-size:10px;color:rgba(245,239,230,.7);letter-spacing:.02em;background:rgba(201,165,116,.09);border:1px solid rgba(201,165,116,.22);border-radius:20px;padding:5px 12px}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .topbar,.hero-content,.prop-body,.video-expand,.client-bar,.gallery-strip{padding-left:20px;padding-right:20px}
  .gallery-strip{height:140px}
  .stay-grid,.highlights-grid{grid-template-columns:1fr}
  .stats-bar{grid-template-columns:1fr 1fr}
  .hero-name{font-size:clamp(32px,9vw,52px)}
  .total-val{font-size:32px}
  .baila-hero{min-height:260px}
  .baila-hero-inner{padding:28px 20px 24px;min-height:260px}
  .baila-hero-logo{height:90px;margin-bottom:12px}
  .baila-hero-name{font-size:clamp(30px,9vw,44px)}
  .baila-hero-location{font-size:11px}
  .baila-event-card{padding:14px 16px}
  .baila-event-title{font-size:19px}
  .baila-cat-row{padding:11px 0}
  .baila-cat-price{font-size:20px}
  .baila-kids-box{flex-direction:column;gap:8px}
  .baila-incl-grid{grid-template-columns:1fr}
  .baila-signature{flex-direction:column;text-align:center;padding:20px 18px}
  .baila-sig-contacts{justify-content:center}
}
@media(max-width:380px){
  .baila-cat-row{flex-direction:column;align-items:flex-start;gap:4px}
  .baila-cat-price{align-self:flex-end}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">RSX TRAVEL</div>
  <div class="topbar-tag">Proposta de Viagem</div>
</div>

<div id="app">
  <div class="loading-state"><div class="loading-bar"></div></div>
</div>

<script>
(function() {
  'use strict';

  /* ── Helpers ── */
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function stripHtml(s) {
    return String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const parts = String(iso).split('-');
    if (parts.length < 3) return iso;
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    if (y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return iso;
    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return `${d} ${months[m-1]} ${y}`;
  }

  function calcNights(checkin, checkout) {
    if (!checkin || !checkout) return 0;
    const a = new Date(checkin), b = new Date(checkout);
    const diff = Math.round((b - a) / 86400000);
    return diff > 0 ? diff : 0;
  }

  function fmtMoney(v) {
    const n = Number(v) || 0;
    return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
  }

  function fmtGuests(stay) {
    const parts = [];
    const adults = parseInt(stay.adults, 10) || 0;
    if (adults) parts.push(adults + (adults === 1 ? ' adulto' : ' adultos'));
    const children = stay.children || [];
    if (children.length) {
      const ages = children.map(a => a + ' ano' + (a === 1 ? '' : 's')).join(', ');
      parts.push(children.length + (children.length === 1 ? ' criança' : ' crianças') + ' (' + ages + ')');
    }
    return parts.join(' · ') || '—';
  }

  function calcTotal(p) {
    return (Number(p.accommodation_price) || 0) +
      (p.services || []).reduce((s, sv) => s + (Number(sv.price) || 0), 0);
  }

  function svcsTotal(p) {
    return (p.services || []).reduce((s, sv) => s + (Number(sv.price) || 0), 0);
  }

  function renderOptions(p, svcsTotalFn) {
    const opts = p.accommodation_options;
    const svc = svcsTotalFn(p);

    // Single option or no options — show classic layout
    if (!opts || opts.length <= 1) {
      const opt = (opts && opts[0]) || null;
      const roomType = (opt && opt.room_type) || p.stay.room_type || '';
      const price = (opt && opt.price) || p.accommodation_price || 0;
      const notes = opt && opt.notes;
      return `
        ${roomType ? `<div class="stay-item" style="margin-bottom:32px;padding:14px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:3px">
          <div class="stay-item-lbl">Acomodação</div>
          <div class="stay-item-val">${esc(roomType)}</div>
          ${notes ? `<div style="font-size:11px;color:rgba(245,239,230,.4);margin-top:5px">${esc(notes)}</div>` : ''}
        </div>` : ''}`;
    }

    // Multiple options — show comparison cards
    const cards = opts.map((opt, i) => {
      const optPrice = Number(opt.price) || 0;
      const total = optPrice + svc;
      const isDiff = opt.resort_name && opt.resort_name !== p.resort.name;
      return `
        <div class="accom-opt-card">
          <div class="accom-opt-badge">${esc(opt.label || ('Opção '+(i+1)))}</div>
          ${isDiff ? `<div class="accom-opt-resort">${esc(opt.resort_name)}${opt.resort_regime ? ' · ' + esc(opt.resort_regime) : ''}</div>` : ''}
          <div class="accom-opt-room">${esc(opt.room_type || '—')}</div>
          ${opt.notes ? `<div class="accom-opt-notes">${esc(opt.notes)}</div>` : ''}
          <div class="accom-opt-price-row">
            <span class="accom-opt-acc">Hospedagem</span>
            <span class="accom-opt-acc-val">${fmtMoney(optPrice)}</span>
          </div>
          ${svc > 0 ? `<div class="accom-opt-price-row" style="font-size:11px;opacity:.6">
            <span>+ Serviços</span><span>${fmtMoney(svc)}</span>
          </div>` : ''}
          <div class="accom-opt-total">
            <span>Total</span><span>${fmtMoney(total)}</span>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="section-eyebrow">Opções de acomodação</div>
      <p style="font-size:12px;color:rgba(245,239,230,.45);margin-bottom:16px;line-height:1.6">Preparei ${opts.length} opções para você — escolha a que preferir e me chame no WhatsApp!</p>
      <div class="accom-opts-grid">${cards}</div>`;
  }

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function ytId(url) {
    var m = (url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&\s?\/]+)/);
    if (!m) return null;
    return /^[a-zA-Z0-9_-]{6,15}$/.test(m[1]) ? m[1] : null;
  }

  /* ── Render ── */
  function render(p, cmsData) {
    const app = document.getElementById('app');
    const pd = cmsData && p.resort.type === 'existing'
      ? ((cmsData.pages || {})[p.resort.slug] || {})
      : {};

    /* Hero image */
    let heroBg = '';
    if (p.resort.type === 'custom' && p.resort.images && p.resort.images.length) {
      heroBg = p.resort.images[0];
    } else {
      heroBg = pd.gallery_1 || pd.gallery_2 || pd.gallery_3 || pd.hero_img || '';
    }

    /* Video */
    let videoId = '';
    if (pd.hero_video_yt) videoId = ytId(pd.hero_video_yt) || '';

    /* Gallery images */
    const galleryImgs = [];
    if (p.resort.type === 'custom') {
      (p.resort.images || []).slice(0, 3).forEach(u => galleryImgs.push(u));
    } else {
      ['gallery_1','gallery_2','gallery_3','gallery_4','gallery_5'].forEach(k => {
        if (pd[k] && galleryImgs.length < 3) galleryImgs.push(pd[k]);
      });
    }

    /* Nights */
    const nights = calcNights(p.stay.checkin, p.stay.checkout);
    const nightsLabel = nights > 0 ? nights + (nights === 1 ? ' noite' : ' noites') : '';

    /* Resort overview from CMS */
    const overviewP1 = stripHtml(pd.overview_p1 || '');
    const overviewP2 = stripHtml(pd.overview_p2 || '');
    const hasOverview = overviewP1 || overviewP2;

    /* Stats */
    const stats = [];
    for (let i = 1; i <= 4; i++) {
      const num = stripHtml(pd['stat' + i + '_num'] || '');
      const lbl = stripHtml(pd['stat' + i + '_label'] || '');
      if (num && lbl) stats.push({ num, lbl });
    }

    /* Highlights */
    const highlights = [];
    for (let i = 1; i <= 6; i++) {
      const title = stripHtml(pd['hl' + i + '_title'] || '');
      const desc  = stripHtml(pd['hl' + i + '_desc']  || '');
      if (title) highlights.push({ title, desc });
    }

    /* Services list */
    const accDesc = p.stay.room_type
      ? esc(p.stay.room_type) + (nightsLabel ? ' · ' + esc(nightsLabel) : '')
      : 'Hospedagem' + (nightsLabel ? ' · ' + esc(nightsLabel) : '');

    const allServices = [
      { icon: '🏨', description: accDesc, price: p.accommodation_price, raw: true },
      ...(p.services || [])
    ].filter(sv => Number(sv.price) > 0);

    const servicesHtml = allServices.map(sv => `
      <div class="service-row">
        <div class="service-left">
          <span class="service-icon">${esc(sv.icon || '🏨')}</span>
          <span class="service-desc">${sv.raw ? sv.description : esc(sv.description)}</span>
        </div>
        <div class="service-price">${fmtMoney(sv.price)}</div>
      </div>`).join('');

    /* Conditions */
    const conds = p.conditions || {};
    const condHtml = (conds.payment_info || conds.cancellation || conds.legal_notes) ? `
      <div class="divider"></div>
      <div class="conditions">
        ${conds.payment_info ? `<div class="cond-item"><div class="cond-label">Forma de pagamento</div><div class="cond-text">${esc(conds.payment_info)}</div></div>` : ''}
        ${conds.cancellation ? `<div class="cond-item"><div class="cond-label">Cancelamento</div><div class="cond-text">${esc(conds.cancellation)}</div></div>` : ''}
        ${conds.legal_notes  ? `<div class="cond-item"><div class="cond-label">Informações gerais</div><div class="cond-text">${esc(conds.legal_notes)}</div></div>` : ''}
      </div>` : '';

    /* WhatsApp */
    const defaultMsg = `Oi Rebeca! Sou ${p.client.name||'seu cliente'}, quero confirmar minha proposta para o ${p.resort.name||'resort'}` +
      (p.stay.checkin ? ` de ${fmtDate(p.stay.checkin)}` : '') +
      (p.stay.checkout ? ` a ${fmtDate(p.stay.checkout)}` : '') +
      `. Pode me ajudar? (Ref: ${p.id})`;
    const waMsg  = encodeURIComponent(conds.whatsapp_message || defaultMsg);
    const waLink = `https://wa.me/5541988429348?text=${waMsg}`;

    /* ── Build HTML ── */
    document.title = `Proposta ${esc(p.client.name)} — RSX Travel`;

    app.innerHTML = `

      <!-- HERO -->
      <div class="hero">
        <div class="hero-bg" style="${heroBg ? 'background-image:url(&#39;' + esc(heroBg) + '&#39;)' : ''}"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          ${p.resort.regime ? `<div class="hero-eyebrow">${esc(p.resort.regime)}</div>` : ''}
          <div class="hero-name">${esc(p.resort.name)}</div>
          ${p.resort.location ? `<div class="hero-location">${esc(p.resort.location)}</div>` : ''}
          ${videoId ? `<button class="hero-video-btn" data-vid="${esc(videoId)}">▶&nbsp; Ver vídeo do resort</button>` : ''}
        </div>
      </div>
      ${videoId ? `<div class="video-expand" id="videoExpand"></div>` : ''}

      <!-- GALLERY STRIP -->
      ${galleryImgs.length >= 2 ? `
        <div class="gallery-strip" style="grid-template-columns:repeat(${galleryImgs.length},1fr)">
          ${galleryImgs.map(u => `<div class="gallery-strip-img" style="background-image:url('${esc(u)}')"></div>`).join('')}
        </div>` : ''}

      <!-- CLIENT BAR -->
      <div class="client-bar">
        <div class="client-name">Proposta para <strong>${esc(p.client.name)}</strong></div>
        ${p.validity ? `<div class="client-validity">Válida até ${fmtDate(p.validity)}</div>` : ''}
      </div>

      <div class="prop-body">

        <!-- RESORT OVERVIEW -->
        ${hasOverview ? `
          <div class="resort-overview">
            <div class="section-eyebrow">Sobre o resort</div>
            ${overviewP1 ? `<p class="resort-overview-text">${esc(overviewP1)}</p>` : ''}
            ${overviewP2 ? `<p class="resort-overview-text">${esc(overviewP2)}</p>` : ''}
          </div>` : ''}

        <!-- STATS -->
        ${stats.length >= 2 ? `
          <div class="stats-bar" style="grid-template-columns:repeat(${stats.length},1fr)">
            ${stats.map(s => `
              <div class="stat-item">
                <div class="stat-num">${esc(s.num)}</div>
                <div class="stat-lbl">${esc(s.lbl)}</div>
              </div>`).join('')}
          </div>` : ''}

        <!-- HIGHLIGHTS -->
        ${highlights.length ? `
          <div class="highlights-section">
            <div class="section-eyebrow">O que tem no resort</div>
            <div class="highlights-grid">
              ${highlights.map(h => `
                <div class="highlight-card">
                  <div class="highlight-title">${esc(h.title)}</div>
                  ${h.desc ? `<div class="highlight-desc">${esc(h.desc)}</div>` : ''}
                </div>`).join('')}
            </div>
          </div>` : ''}

        <!-- ESTADIA -->
        <div class="stay-section">
          <div class="section-eyebrow">Sua estadia</div>
          <div class="stay-grid">
            <div class="stay-item"><div class="stay-item-lbl">Check-in</div><div class="stay-item-val">${fmtDate(p.stay.checkin)}</div></div>
            <div class="stay-item"><div class="stay-item-lbl">Check-out</div><div class="stay-item-val">${fmtDate(p.stay.checkout)}</div></div>
            <div class="stay-item" style="grid-column:1/-1"><div class="stay-item-lbl">Hóspedes</div><div class="stay-item-val">${esc(fmtGuests(p.stay))}</div></div>
          </div>
          ${nightsLabel ? `<div class="stay-nights-badge">🌙 ${esc(nightsLabel)}</div>` : ''}
        </div>

        <!-- ACCOMMODATION OPTIONS -->
        ${renderOptions(p, svcsTotal)}

        <!-- SERVICES (non-accommodation) -->
        ${(p.services||[]).filter(sv=>Number(sv.price)>0).length ? `
        <div class="section-eyebrow" style="margin-top:8px">Serviços incluídos</div>
        <div class="services-section">
          ${(p.services||[]).filter(sv=>Number(sv.price)>0).map(sv=>`
          <div class="service-row">
            <div class="service-left"><span class="service-icon">${esc(sv.icon||'➕')}</span><span class="service-desc">${esc(sv.description)}</span></div>
            <div class="service-price">${fmtMoney(sv.price)}</div>
          </div>`).join('')}
        </div>` : ''}

        <!-- TOTAL (only show single total if ONE option) -->
        ${(!p.accommodation_options || p.accommodation_options.length <= 1) ? `
        <div class="total-box">
          <div class="total-lbl">Total da viagem</div>
          <div class="total-val">${fmtMoney(calcTotal(p))}</div>
        </div>` : `
        <div style="background:rgba(201,165,116,.05);border:1px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:32px;font-size:12px;color:rgba(245,239,230,.5);text-align:center">
          Os totais de cada opção estão indicados nos cards acima · os serviços incluídos são os mesmos para todas as opções
        </div>`}

        <!-- WHATSAPP CTA -->
        <a href="${waLink}" target="_blank" rel="noopener" class="cta-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1.1-1.1 2.6 0 1.6 1.1 3.1 1.3 3.3.2.2 2.3 3.5 5.6 4.9.8.3 1.4.5 1.9.7.8.2 1.5.2 2.1.1.6-.1 1.8-.7 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.5.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
          Quero essa viagem!
        </a>

        <!-- CONDITIONS -->
        ${condHtml}

      </div><!-- /prop-body -->

      <div class="prop-footer">
        <div class="prop-footer-logo">RSX TRAVEL</div>
        <div class="prop-footer-tag">Rebeca Piccolo · Curitiba PR · rsxtravel.com.br</div>
      </div>
    `;

    /* Wire video button */
    const vidBtn = app.querySelector('.hero-video-btn');
    if (vidBtn) vidBtn.addEventListener('click', function() { toggleVideo(this, this.dataset.vid); });
  }

  function toggleVideo(btn, vid) {
    const wrap = document.getElementById('videoExpand');
    if (!wrap) return;
    if (wrap.classList.contains('open')) {
      wrap.classList.remove('open');
      wrap.innerHTML = '';
      btn.innerHTML = '▶&nbsp; Ver vídeo do resort';
    } else {
      wrap.classList.add('open');
      wrap.innerHTML = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3" title="Vídeo do resort" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`;
      btn.textContent = '✕ Fechar vídeo';
    }
  }
  window.toggleVideo = toggleVideo;

  function showError(msg) {
    document.getElementById('app').innerHTML = `
      <div class="error-state">
        <div class="error-title">Proposta não encontrada</div>
        <div class="error-sub">${esc(msg)}</div>
        <a href="index.html" style="margin-top:8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,165,116,.5)">← Voltar ao site</a>
      </div>`;
  }

  function fmtMoney0(v) {
    return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
  }

  function renderBaila(p) {

      <div class="baila-cat-row">
        <div>
          <div class="baila-cat-name">${esc(c.nome)}</div>
          <div class="baila-cat-detail">${esc(c.detalhe)}</div>
        </div>
        <div class="baila-cat-price">${fmtMoney0(c.preco)}</div>
      </div>`).join('');

    const hasSuite = (p.cats||[]).some(c => /ala internacional/i.test(c.detalhe||''));
    const benefSuite = hasSuite ? `
      <div class="cond-item">
        <div class="cond-label">Benefícios exclusivos · Ala Internacional</div>
        <div class="cond-text">01 procedimento de 20 minutos no SPA por adulto. Crédito de R$ 100,00 por adulto/dia para consumo no Rancho do Pescador – Ilhote do Baú. Não é permitida a reserva de ala/grupo; crédito válido apenas para alimentos e bebidas no local, não reembolsável.</div>
      </div>` : '';

    const valStr = p.validade ? fmtDate(p.validade) : '';
    const barRight = (p.lote || valStr)
      ? `<div class="client-validity">${p.lote?esc(p.lote):''}${(p.lote&&valStr)?' · ':''}${valStr?'Válida até '+valStr:''}</div>`
      : '';

    const defaultMsg = `Oi Rebeca! Sou ${cliente}, quero confirmar minha proposta do Baila Costão 2027 (${p.noites} noites). Pode me ajudar? (Ref: ${p.id})`;
    const waLink = `https://wa.me/5541988429348?text=${encodeURIComponent(defaultMsg)}`;

    app.innerHTML = `
      <div class="baila-hero">
        <div class="baila-hero-bg"></div>
        <div class="baila-hero-overlay"></div>
        <div class="baila-hero-inner">
          <img class="baila-hero-logo" src="https://rsxtravel.com.br/midia/baila-costao-logo.png?v=4" alt="Baila Costão" onerror="this.style.display='none'"/>
          <div class="baila-hero-eyebrow">All Inclusive · ${p.noites} Noites</div>
          <div class="baila-hero-name">Baila Costão 2027</div>
          <div class="baila-hero-location">Resort Costão do Santinho · Florianópolis / SC</div>
        </div>
      </div>

      <div class="client-bar">
        <div class="client-name">Proposta para <strong>${esc(cliente)}</strong></div>
        ${barRight}
      </div>

      <div class="prop-body">
        <div class="resort-overview">
          <p class="resort-overview-text">Obrigada pelo contato e pela confiança! Sou <strong style="color:var(--gold-200)">Rebeca, da RSX Travel</strong>, e será um prazer cuidar da sua viagem para o <strong style="color:var(--gold-200)">Baila Costão 2027</strong> — um pacote de ${p.noites} noites all inclusive no incrível Resort Costão do Santinho.</p>
          <p class="resort-overview-text">Mais que hospedagem, o Baila Costão entrega dança, diversão e experiências à beira-mar: aulas de diversos ritmos, personal dancers, bailes temáticos, espetáculos, gincanas e muita animação.</p>
        </div>

        <div class="section-eyebrow">O pacote</div>
        <div class="baila-event-card">
          <div class="baila-event-title">${p.noites} Noites · ${esc(p.periodo)}</div>
          <div class="baila-event-meta">${esc(p.dias)} · Resort Costão do Santinho</div>
        </div>

        <div class="section-eyebrow">Valores por pessoa</div>
        ${catRows}

        <div class="baila-kids-box">
          <div class="baila-kids-item"><div class="baila-kids-lbl">0 a 3 anos · berço</div><div class="baila-kids-val">Cortesia</div></div>
          <div class="baila-kids-item"><div class="baila-kids-lbl">4 a 11 anos · cama extra</div><div class="baila-kids-val">${fmtMoney0(p.cri04)}</div></div>
        </div>

        <div class="baila-alert">⚡ Os apartamentos são limitados e as vendas podem ser encerradas antes do prazo, sem aviso prévio. <strong>Este é um orçamento informativo — não há reserva confirmada.</strong> A confirmação é garantida somente mediante pagamento.</div>

        <div class="section-eyebrow">O que está incluído</div>
        <div class="baila-incl-grid">
          <div class="baila-incl-card"><div class="baila-incl-title">Regime All Inclusive</div><div class="baila-incl-desc">Café da manhã, almoço, jantar e lanches. Bebidas à vontade: água, refrigerantes, sucos, drinks, caipirinhas, chopp, cerveja, vinhos, uísque 8 anos e espumantes.</div></div>
          <div class="baila-incl-card"><div class="baila-incl-title">Programação Baila Costão</div><div class="baila-incl-desc">Aulas de dança, bailes temáticos, gincanas e apresentações. A programação completa é divulgada mais perto da data do evento.</div></div>
          <div class="baila-incl-card"><div class="baila-incl-title">Frigobar abastecido</div><div class="baila-incl-desc">Água e refrigerantes, com reposição mediante solicitação à governança.</div></div>
          <div class="baila-incl-card"><div class="baila-incl-title">Check-in / Check-out</div><div class="baila-incl-desc">Entrada a partir das 15h e saída até as 11h. O almoço do dia da saída está incluso, com permanência nas dependências até as 15h.</div></div>
        </div>

        <a href="${waLink}" target="_blank" rel="noopener" class="cta-btn" style="margin-top:36px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1.1-1.1 2.6 0 1.6 1.1 3.1 1.3 3.3.2.2 2.3 3.5 5.6 4.9.8.3 1.4.5 1.9.7.8.2 1.5.2 2.1.1.6-.1 1.8-.7 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.5.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>

        </a>

        <div class="divider"></div>
        <div class="conditions">
          <div class="cond-item"><div class="cond-label">Formas de pagamento</div><div class="cond-text">Em até 10x sem juros nos cartões de crédito Visa ou Mastercard, através de link de cartão. À vista no Pix.</div></div>
          ${benefSuite}
          <div class="cond-item"><div class="cond-label">O valor não inclui</div><div class="cond-text">Atividades de custo extra (consulte), transfer e transporte, e demais extras em cash.</div></div>
          <div class="cond-item"><div class="cond-label">Política de cancelamento</div><div class="cond-text">Até 60 dias antes do check-in: multa de 20% do valor da reserva. Entre 59 e 30 dias: multa de 30%. Menos de 29 dias: multa de 100%. O valor pago é convertido em carta de crédito válida por 1 ano para uma nova reserva. Exceto em períodos de catástrofe, pandemia ou calamidade pública.</div></div>
          <div class="cond-item"><div class="cond-label">Informações gerais</div><div class="cond-text">Valores por pessoa, com base na ocupação mínima por apartamento. Tarifas e disponibilidade sujeitas a alteração sem aviso prévio.</div></div>
        </div>

        <div class="baila-sig-msg">Muito obrigada. Vamos juntos nessa viagem incrível! Qualquer dúvida, é só me chamar. Com carinho,</div>
        <div class="baila-signature">
          <div class="baila-sig-avatar"></div>
          <div>
            <div class="baila-sig-name">Rebeca Piccolo</div>
            <div class="baila-sig-role">Consultora de Viagens · RSX Travel</div>
            <div class="baila-sig-contacts">
              <span class="baila-sig-chip">WhatsApp · 41 98842-9348</span>
              <span class="baila-sig-chip">rsxtravel.com.br</span>
              <span class="baila-sig-chip">Instagram · @rebecapiccolo</span>
            </div>
          </div>
        </div>
      </div>

      <div class="prop-footer">
        <div class="prop-footer-logo">RSX TRAVEL</div>
        <div class="prop-footer-tag">Rebeca Piccolo · Curitiba PR · rsxtravel.com.br</div>
      </div>`;
  }

  async function init() {
    const id = getParam('id');
    if (!id) { showError('Nenhum ID de proposta foi informado na URL.'); return; }
    try {
      const r = await fetch('proposals-save.php?_=' + Date.now());
      if (!r.ok) throw new Error('Servidor indisponível');
      const json = await r.json();
      const proposal = (json.proposals || {})[id];
      if (!proposal) { showError('A proposta "' + id + '" não existe ou foi removida.'); return; }

      if (proposal.type === 'baila') { renderBaila(proposal); return; }

      let cmsData = null;
      if (proposal.resort && proposal.resort.type === 'existing') {
        try {
          const cr = await fetch('cms-data.json?_=' + Date.now());
          if (cr.ok) cmsData = await cr.json();
        } catch(e) {}
      }
      render(proposal, cmsData);
    } catch(e) {
      console.error('proposta.html error:', e);
      showError('Erro ao carregar a proposta. Tente novamente em alguns segundos.');
    }
  }

  init();
}());
</script>
